<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DictFlow Overlay</title>
  </head>
  <body>
    <div id="pill" class="idle" title="Click to start or stop dictation">
      <div class="idle-bars" aria-hidden="true">

      <span class="status" id="status">Transcribing...</span>
    </div>
    <script type="module" src="/src/overlay.ts"></script>
