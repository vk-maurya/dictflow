[package]
name = "dictflow"
version = "0.3.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
cpal = "0.17"
hound = "3.5"
arboard = "3"
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "json", "blocking", "multipart"] }
sherpa-onnx = "1.13"
regex = "1"
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# macOS-only: AppKit / Keychain. Windows builds must not pull these crates.
# `macos-private-api` stays on the shared `tauri` features above because
# tauri-build matches Cargo.toml against tauri.conf.json (not target cfg);
# that feature is a compile flag, not a Mac crate.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = "0.2"
objc2-app-kit = { version = "0.2", features = ["NSWorkspace", "NSRunningApplication", "libc"] }
libc = "0.2"
keyring = { version = "3", default-features = false, features = ["apple-native"] }

# Windows-only: Credential Manager + Ctrl+V injection.
# macOS builds must not pull windows-native keyring or enigo.
[target.'cfg(target_os = "windows")'.dependencies]
enigo = { version = "0.2", features = ["serde"] }
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
