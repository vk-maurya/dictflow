name: release

on:
  push:
    tags: ["v*"]

# tauri-action creates the draft release + uploads assets via GITHUB_TOKEN.
# Without this the token is read-only and both build jobs fail with
# "Resource not accessible by integration". (Regression from #3 which
# dropped this block; v0.2.0 had it and released fine.)
permissions:
  contents: write

jobs:
  # Both build jobs race to create the same draft release if it doesn't
  # exist yet, so create it once up front. The tauri-action steps below
  # then find the draft and only upload assets.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release if missing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "${{ github.repository }}" --draft \
              --title "DictFlow $TAG" \
              --notes "Offline voice dictation for Windows and macOS. See README for setup."
          fi

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DictFlow ${{ github.ref_name }}"
          releaseBody: "Offline voice dictation for Windows and macOS. See README for setup."
          releaseDraft: true
          prerelease: false

  build-macos-arm:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build app (Apple Silicon)
        run: npx tauri build --target aarch64-apple-darwin

      # Ad-hoc sign the .app so Apple Silicon Macs can launch unsigned binaries.
      # Users downloading from GitHub Releases still need to run:
      #   xattr -dr com.apple.quarantine DictFlow.app
      # or right-click → Open on first launch.
      - name: Ad-hoc code sign
        run: |
          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name "*.app" | head -1)
          codesign --force --deep --sign - "$APP"

      - name: Upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DictFlow ${{ github.ref_name }}"
          releaseBody: "Offline voice dictation for Windows and macOS. See README for setup."
          releaseDraft: true
          prerelease: false
          args: --target aarch64-apple-darwin
