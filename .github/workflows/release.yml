name: release

on:
  push:
    tags: ["v*"]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DictFlow ${{ github.ref_name }}"
          releaseBody: "Offline voice dictation for Windows and macOS. See README for setup."
          releaseDraft: true
          prerelease: false

  build-macos-arm:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build app (Apple Silicon)
        run: npx tauri build --target aarch64-apple-darwin

      # tauri.conf.json signingIdentity "-" signs the .app before the DMG is
      # packed. Do not codesign --deep afterwards; that does not update the DMG.
      - name: Verify signed app inside the DMG
        run: bash scripts/verify-macos-bundle.sh

      - name: Upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DictFlow ${{ github.ref_name }}"
          releaseBody: "Offline voice dictation for Windows and macOS. See README for setup."
          releaseDraft: true
          prerelease: false
          args: --target aarch64-apple-darwin
